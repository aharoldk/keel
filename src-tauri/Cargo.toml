[package]
name = "keel"
version = "0.1.4"
description = "Keel — a local-first, Git-native API client"
authors = ["Keel contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
autobins = false
default-run = "keel"

[features]
cli = []

[[bin]]
name = "keel"
path = "src/main.rs"

[[bin]]
name = "keel-cli"
path = "src/bin/keel_cli.rs"
required-features = ["cli"]

[lib]
name = "keel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "multipart",
  "stream",
  "gzip",
  "cookies",
  "http2",
  "socks",
] }
git2 = { version = "0.19", default-features = false }
notify = "8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
keel-engine = { path = "../crates/keel-engine" }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
