[package]
name = "keel-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The Keel format and runtime: parse, serialize, inherit and interpolate local-first API workspaces, then send requests, run collections and import/export."
license = "MIT"
repository = "https://github.com/aharoldk/keel"
homepage = "https://github.com/aharoldk/keel"
readme = "README.md"
keywords = ["api-client", "yaml", "local-first", "http", "runner"]
categories = ["development-tools", "parser-implementations", "web-programming::http-client"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "multipart",
  "stream",
  "gzip",
  "cookies",
  "http2",
  "socks",
] }
git2 = { version = "0.19", default-features = false }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "tls12", "webpki-roots", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
boa_engine = "0.22"
md-5 = "0.11"
sha2 = "0.11"
rand = "0.9"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
mime_guess = "2"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
