schemaVersion: '1'
name: Introspect schema
kind: request
description: The exact introspection query keel sends — the mock's schema populates the field picker.
protocol: graphql
graphql:
  operation: query
request:
  method: POST
  url: '{{baseUrl}}/graphql'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: graphql
    query: |
      query Query($id: ID!) {
        user(id: $id) {
          name
          email
          id
        }
      }
    variables: |-
      {
        "id": 1
      }
