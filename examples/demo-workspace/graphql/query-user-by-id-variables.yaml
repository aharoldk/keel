schemaVersion: '1'
name: Query — user by id (variables)
kind: request
description: graphql body with variables string → BodyType::Graphql + variables.
request:
  method: POST
  url: '{{baseUrl}}/graphql'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: graphql
    query: |
      query GetUser($id: ID!) {
        user(id: $id) {
          id
          name
          email
          age
          active
          tags
          address {
            city
            country
          }
        }
      }
    variables: |-
      {
        "id": "{{userId}}"
      }
