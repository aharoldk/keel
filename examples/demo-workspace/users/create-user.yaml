schemaVersion: "1"
name: Create User
request:
  method: POST
  url: "{{baseUrl}}/users"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Ada Lovelace",
        "email": "ada@example.com"
      }
scripts:
  postResponse: |-
    set("userId", json("id"))
tests:
  - expect: response.status
    toBe: 201
  - expect: response.json.id
    toBeType: number
